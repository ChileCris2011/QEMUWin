name: Build Latest
on:
  push:
    branches: latest
    tags: "v*"
  pull_request:
    branches: latest
    types:
      - closed
  
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Generate version metadata
        id: version
        shell: pwsh
        run: |
          python tools/generate_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Build primary executable
        run: |
          pyinstaller qemuwin.spec
          
      - name: Install Inno Setup
        run: choco install innosetup

      - name: Build Installer
        run: |
          iscc installer.iss

      - name: Upload artifact to test
        uses: actions/upload-artifact@v7
        with:
          path: Output
