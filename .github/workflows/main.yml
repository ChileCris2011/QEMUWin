name: Build Release

on:
  push:
      tags: "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Generate version metadata
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'tag') {
            python tools/generate_version.py --release-tag "$env:GITHUB_REF_NAME"
          } else {
            python tools/generate_version.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Build primary executable
        run: |
          pyinstaller qemuwin.spec
          
      - name: Install Inno Setup
        run: choco install innosetup

      - name: Build Installer
        run: |
          iscc installer.iss

      - name: Upload manual build
        if: github.event_name != 'push' || github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          path: Output

      - name: Create Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: QEMU Manager ${{ github.ref_name }}
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: Output/QEMUWin_Setup.exe
